# Scans the API source (TopDev) every 6 hours. HTML sources (ITviec, TopCV) run from
# a personal machine — see README. Minute 17 avoids the scheduler's top-of-hour rush.
name: scan-topdev
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan TopDev
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not configured (Neon) — skipping without failing."
            exit 0
          fi
          pnpm scan --sources topdev
