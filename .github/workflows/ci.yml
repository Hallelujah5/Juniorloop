name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit test (core)
        run: pnpm test
      - name: Typecheck packages
        run: pnpm --filter "@juniorloop/*" typecheck
